# Local dev dependencies for the Node backend.
# Ports are offset from the Laravel stack and other projects on this box.
#
# One database: PostgreSQL + TimescaleDB extension (D-0020). Relational tables and
# the IoT time-series (device_values hypertable + continuous-aggregate rollups)
# all live here. No separate time-series service.
name: convoyai-node-dev

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: convoyai
      POSTGRES_USER: convoyai
      POSTGRES_PASSWORD: convoyai
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoyai -d convoyai"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
