components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`Authorization: Bearer <token>` where the token is `token` (== `access_token`) from `POST /login`. Valid 7 days; revoked by `POST /logout`."
  responses:
    Unauthenticated:
      description: "Unauthenticated. Missing, malformed, expired or logged-out bearer token. Possible messages: `Authentication required`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Authentication required
              value:
                success: false
                message: Authentication required
    InternalServerError:
      description: "Internal server error. Unexpected failure; no detail is leaked to the client. Possible messages: `Internal server error`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Internal server error
              value:
                success: false
                message: Internal server error
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - success
        - message
    Summary:
      type: object
      properties:
        mode:
          type: string
          enum:
            - filter
            - ids
        matched:
          type: number
        processed:
          type: number
        succeeded:
          type: number
        changed:
          type: number
        failed:
          type: integer
      required:
        - mode
        - matched
        - processed
        - succeeded
        - changed
        - failed
    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          const: false
        message:
          type: string
          description: The first validation message.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field (dot path) -> messages.
    YardSlotOccupancy:
      type: object
      properties:
        id:
          type: string
        yard_slot_id:
          type: string
        vehicle_id:
          type: string
        checked_in_at:
          type: string
          format: date-time
        checked_out_at:
          type:
            - string
            - "null"
          format: date-time
        source:
          type: string
          enum:
            - manual
            - gps_proximity
      required:
        - id
        - yard_slot_id
        - vehicle_id
        - checked_in_at
        - checked_out_at
        - source
