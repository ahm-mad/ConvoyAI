components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`Authorization: Bearer <token>` where the token is `token` (== `access_token`) from `POST /login`. Valid 7 days; revoked by `POST /logout`."
  responses:
    Unauthenticated:
      description: "Unauthenticated. Missing, malformed, expired or logged-out bearer token. Possible messages: `Authentication required`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Authentication required
              value:
                success: false
                message: Authentication required
    InternalServerError:
      description: "Internal server error. Unexpected failure; no detail is leaked to the client. Possible messages: `Internal server error`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Internal server error
              value:
                success: false
                message: Internal server error
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - success
        - message
    SharedV2:
      type: object
      properties:
        vehicle_id:
          type: string
        vehicle_name:
          type: string
        plate:
          type:
            - string
            - "null"
        vehicle_category:
          type:
            - string
            - "null"
        has_tracker:
          type: boolean
        distance_km:
          type: number
        distance_source:
          type:
            - string
            - "null"
          enum:
            - telemetry
            - odometer
            - trip
        driving_hours:
          type: number
        idle_hours:
          type: number
        utilisation_rate:
          type: number
        utilisation_basis:
          type: string
        trip_count:
          type: integer
        fuel_used_liters:
          type: number
        fuel_efficiency:
          type:
            - number
            - "null"
        fuel_cost:
          type: number
        maintenance_cost:
          type: number
        cost_per_km:
          type:
            - number
            - "null"
        incident_count:
          type: integer
      required:
        - vehicle_id
        - vehicle_name
        - plate
        - vehicle_category
        - has_tracker
        - distance_km
        - distance_source
        - driving_hours
        - idle_hours
        - utilisation_rate
        - utilisation_basis
        - trip_count
        - fuel_used_liters
        - fuel_efficiency
        - fuel_cost
        - maintenance_cost
        - cost_per_km
        - incident_count
    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          const: false
        message:
          type: string
          description: The first validation message.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field (dot path) -> messages.
