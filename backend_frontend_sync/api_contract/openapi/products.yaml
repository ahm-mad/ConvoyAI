      properties:
        current_page:
          type: integer
        first_page_url:
          type: string
        from:
          type:
            - integer
            - "null"
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type:
                  - string
                  - "null"
              label:
                type: string
              active:
                type: boolean
            required:
              - url
              - label
              - active
        next_page_url:
          type:
            - string
            - "null"
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type:
            - string
            - "null"
        to:
          type:
            - integer
            - "null"
        total:
          type: integer
        data:
          type: array
          items: {}
      required:
        - current_page
        - first_page_url
        - from
        - last_page
        - last_page_url
        - links
        - next_page_url
        - path
        - per_page
        - prev_page_url
        - to
        - total
        - data
