openapi: 3.1.0
info:
  title: ConvoyAI API — auth
  version: 1.0.0
  description: One module of the ConvoyAI API contract (10 operations). Part of `openapi.yaml` (the index) + `API_CONTRACT.md` (conventions, realtime, known problems) — read those first if this is your only file. Regenerated by `npm run openapi:write` in `node-backend/`; do not hand-edit.
servers:
  - url: /api
    description: All routes are mounted under /api
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Login, registration, verification, password reset, Google popup login, token refresh/logout.
paths:
  /auth/{provider}/callback:
    get:
      tags:
        - auth
      summary: Social callback
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
          x-shape-source: typescript
        "302":
          description: OK (no body)
          x-shape-source: typescript
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed. Request failed validation; `errors` maps each field to its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-unvalidated-query: true
      description: OAuth callback — returns an HTML page (window.opener.postMessage), not JSON
      operationId: getAuthByProviderCallback
      security: []
      x-auth: public
      x-quirks:
        - 'Returns an **HTML page** (not JSON) that `postMessage`s `{ type: "GOOGLE_AUTH_SUCCESS", token, user, … }` to the opener (target origin = `FRONTEND_URL`) and closes itself; on failure it redirects with `?error=auth_failed`.'
        - New social users are onboarded (company, admin role, placeholder subscription) before the token is issued.
      x-tested-with-frontend:
        log_row: 22
        decisions:
          - D-0132
          - D-0133
  /auth/{provider}/redirect:
    get:
      tags:
        - auth
      summary: Social redirect
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  redirect_url:
                    type: string
                required:
                  - success
                  - redirect_url
          x-shape-source: typescript
        "422":
          description: 'Validation failed. Request failed validation; `errors` maps each field to its messages. Possible messages: `Provider [{provider ?? ""}] is not supported.`; `Provider [{provider}] is not configured.`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                m1:
                  summary: Provider [{provider ?? ""}] is not supported.
                  value:
                    success: false
                    message: Provider [{provider ?? ""}] is not supported.
                m2:
                  summary: Provider [{provider}] is not configured.
                  value:
                    success: false
                    message: Provider [{provider}] is not configured.
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Get OAuth redirect URL (google|github only)
      operationId: getAuthByProviderRedirect
      security: []
      x-auth: public
      x-quirks:
        - "Google popup flow (only `google` is configured): returns JSON `{ redirect_url }`; the frontend opens it in a popup."
      x-tested-with-frontend:
        log_row: 22
        decisions:
          - D-0132
          - D-0133
  /change-password:
    post:
      tags:
        - auth
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
              required:
                - current_password
                - new_password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  message:
                    const: Password changed successfully
                required:
                  - success
                  - message
          x-shape-source: typescript
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "Forbidden. Possible messages: `Current password does not match`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                m1:
                  summary: Current password does not match
                  value:
                    success: false
                    message: Current password does not match
        "422":
          description: Validation failed. Request failed validation; `errors` maps each field to its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Change the authenticated user's password
      operationId: postChangePassword
      security:
        - bearerAuth: []
      x-auth: bearer
  /forgot-password:
    post:
      tags:
        - auth
      summary: Forgot password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  message:
                    const: We have emailed your password reset link.
                required:
                  - success
                  - message
          x-shape-source: typescript
        "422":
          description: "Validation failed. Request failed validation; `errors` maps each field to its messages. Possible messages: `The selected email is invalid.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                m1:
                  summary: The selected email is invalid.
                  value:
                    success: false
                    message: The selected email is invalid.
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Send a password reset link
      operationId: postForgotPassword
      security: []
      x-auth: public
  /login:
    post:
      tags:
        - auth
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  message:
                    const: Login successful
                  user:
                    type: object
                    properties:
                      social_provider:
                        type:
                          - string
                          - "null"
                      company:
                        anyOf:
                          - $ref: "#/components/schemas/Company"
                          - type: "null"
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            company_id:
                              type: integer
                            name:
                              type: string
                            display_name:
                              type:
                                - string
                                - "null"
                            description:
                              type:
                                - string
                                - "null"
                            created_by:
                              type:
                                - integer
                                - "null"
                            created_at:
                              type:
                                - string
                                - "null"
                            updated_at:
                              type:
                                - string
                                - "null"
                            permissions:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                                  created_at:
                                    type:
                                      - string
                                      - "null"
                                  updated_at:
                                    type:
                                      - string
                                      - "null"
                                required:
                                  - id
                                  - name
                                  - created_at
                                  - updated_at
                          required:
                            - id
                            - company_id
                            - name
                            - display_name
                            - description
                            - created_by
                            - created_at
                            - updated_at
                            - permissions
                      companyInfo:
                        type: boolean
                      role_type:
                        type:
                          - string
                          - "null"
                      id:
                        type: integer
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      number:
                        type: string
                      company_id:
                        type:
                          - integer
                          - "null"
                      status:
                        type: string
                      email_verified_at:
                        type:
                          - string
                          - "null"
                    required:
                      - social_provider
                      - company
                      - roles
                      - companyInfo
                      - role_type
                      - id
                      - first_name
                      - last_name
                      - email
                      - number
                      - company_id
                      - status
                      - email_verified_at
                  token:
                    type: string
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  packet_issues:
                    type: array
                    items: {}
                required:
                  - success
                  - message
                  - user
                  - token
                  - access_token
                  - refresh_token
                  - packet_issues
          x-shape-source: typescript
        "401":
          description: "Unauthenticated. Possible messages: `Invalid credentials`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                m1:
                  summary: Invalid credentials
                  value:
                    success: false
                    message: Invalid credentials
        "403":
          description: "Forbidden. Possible messages: `Please verify your email first.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                m1:
                  summary: Please verify your email first.
                  value:
                    success: false
                    message: Please verify your email first.
        "422":
          description: Validation failed. Request failed validation; `errors` maps each field to its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Login with email + password
      operationId: postLogin
      security: []
      x-auth: public
      x-quirks:
        - "`token` and `access_token` are the same JWT."
        - "`user` is the login-style object: `company`, `roles` (with `permissions`), `companyInfo`, `role_type`, `social_provider` — the frontend routes on `companyInfo`."
      x-deviation:
        - decision: D-0125
          what: "Login token lives 7 days (Laravel: short-lived); `refresh_token` and `POST /refresh` exist but the frontend does not use them."
          refs: KNOWN_ISSUES 11.64
        - decision: D-0102
          what: "`guard_name` and `pivot` are deliberately not emitted on roles/permissions."
      x-tested-with-frontend:
        log_row: 1
        decisions:
          - D-0098
          - D-0101
          - D-0102
  /logout:
    post:
      tags:
        - auth
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  message:
                    const: Logged out successfully.
                required:
                  - success
                  - message
          x-shape-source: typescript
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Validation failed. Request failed validation; `errors` maps each field to its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Revoke the current access token and (if supplied) its refresh token
      operationId: postLogout
      security:
        - bearerAuth: []
      x-auth: bearer
  /refresh:
    post:
      tags:
        - auth
      summary: Refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
                - refresh_token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    const: bearer
                required:
                  - access_token
                  - refresh_token
                  - token_type
          x-shape-source: typescript
        "401":
          description: "Unauthenticated. Possible messages: `Invalid or expired refresh token`; `Refresh token has been revoked`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                m1:
                  summary: Invalid or expired refresh token
                  value:
                    success: false
                    message: Invalid or expired refresh token
                m2:
                  summary: Refresh token has been revoked
                  value:
                    success: false
                    message: Refresh token has been revoked
        "422":
          description: Validation failed. Request failed validation; `errors` maps each field to its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Rotate a refresh token for a new access+refresh pair
      operationId: postRefresh
      security: []
      x-auth: public
  /register:
    post:
      tags:
        - auth
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  maxLength: 255
                last_name:
                  type: string
                  maxLength: 255
                number:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  maxLength: 255
                  format: email
                password:
                  type: string
                  minLength: 8
                timezone:
                  type: string
                locale:
                  type: string
              required:
                - first_name
                - last_name
                - number
                - email
                - password
                - timezone
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  message:
                    const: User created successfully with basic plan.
                  user:
                    $ref: "#/components/schemas/UserSummary"
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    const: bearer
                required:
                  - success
                  - message
                  - user
                  - access_token
                  - refresh_token
                  - token_type
          x-shape-source: typescript
        "422":
          description: "Validation failed. Request failed validation; `errors` maps each field to its messages. Possible messages: `The email has already been taken.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                m1:
                  summary: The email has already been taken.
                  value:
                    success: false
                    message: The email has already been taken.
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Register a new user (does NOT create a company — see 5.3 onboarding)
      operationId: postRegister
      security: []
      x-auth: public
      x-quirks:
        - Sends the branded verification e-mail (SMTP).
        - Response carries an extra `refresh_token` and a leaner `user` than Laravel (payload-only comparison rule).
      x-tested-with-frontend:
        log_row: 21
        decisions:
          - D-0131
  /reset-password:
    post:
      tags:
        - auth
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
              required:
                - token
                - email
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  message:
                    const: Your password has been reset.
                required:
                  - success
                  - message
          x-shape-source: typescript
        "401":
          description: "Unauthenticated. Possible messages: `This password reset token is invalid.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                m1:
                  summary: This password reset token is invalid.
                  value:
                    success: false
                    message: This password reset token is invalid.
        "422":
          description: Validation failed. Request failed validation; `errors` maps each field to its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Reset password using a token
      operationId: postResetPassword
      security: []
      x-auth: public
  /verify-reset-token:
    post:
      tags:
        - auth
      summary: Verify reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
              required:
                - email
                - token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  message:
                    const: Token is valid.
                required:
                  - success
                  - message
          x-shape-source: typescript
        "401":
          description: "Unauthenticated. Possible messages: `This password reset token is invalid.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                m1:
                  summary: This password reset token is invalid.
                  value:
                    success: false
                    message: This password reset token is invalid.
        "422":
          description: Validation failed. Request failed validation; `errors` maps each field to its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Check a password-reset token is valid without consuming it (closes 11.7)
      operationId: postVerifyResetToken
      security: []
      x-auth: public
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`Authorization: Bearer <token>` where the token is `token` (== `access_token`) from `POST /login`. Valid 7 days; revoked by `POST /logout`."
  responses:
    Unauthenticated:
      description: "Unauthenticated. Missing, malformed, expired or logged-out bearer token. Possible messages: `Authentication required`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Authentication required
              value:
                success: false
                message: Authentication required
    InternalServerError:
      description: "Internal server error. Unexpected failure; no detail is leaked to the client. Possible messages: `Internal server error`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Internal server error
              value:
                success: false
                message: Internal server error
  schemas:
    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        state:
          type:
            - string
            - "null"
        country:
          type:
            - string
            - "null"
        zip_code:
          type:
            - string
            - "null"
        currency:
          type: string
        created_at:
          type:
            - string
            - "null"
        updated_at:
          type:
            - string
            - "null"
      required:
        - id
        - name
        - email
        - address
        - city
        - state
        - country
        - zip_code
        - currency
        - created_at
        - updated_at
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - success
        - message
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        number:
          type: string
        company_id:
          type:
            - integer
            - "null"
        status:
          type: string
        email_verified_at:
          type:
            - string
            - "null"
      required:
        - id
        - first_name
        - last_name
        - email
        - number
        - company_id
        - status
        - email_verified_at
    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          const: false
        message:
          type: string
          description: The first validation message.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field (dot path) -> messages.
