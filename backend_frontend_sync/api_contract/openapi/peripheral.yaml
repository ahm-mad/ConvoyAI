components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`Authorization: Bearer <token>` where the token is `token` (== `access_token`) from `POST /login`. Valid 7 days; revoked by `POST /logout`."
  responses:
    Unauthenticated:
      description: "Unauthenticated. Missing, malformed, expired or logged-out bearer token. Possible messages: `Authentication required`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Authentication required
              value:
                success: false
                message: Authentication required
    InternalServerError:
      description: "Internal server error. Unexpected failure; no detail is leaked to the client. Possible messages: `Internal server error`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Internal server error
              value:
                success: false
                message: Internal server error
  schemas:
    ContactMessage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        message:
          type: string
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - name
        - email
        - subject
        - message
        - created_at
        - updated_at
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - success
        - message
    LaravelPaginator:
      type: object
      properties:
        current_page:
          type: integer
        first_page_url:
          type: string
        from:
          type:
            - integer
            - "null"
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type:
                  - string
                  - "null"
              label:
                type: string
              active:
                type: boolean
            required:
              - url
              - label
              - active
        next_page_url:
          type:
            - string
            - "null"
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type:
            - string
            - "null"
        to:
          type:
            - integer
            - "null"
        total:
          type: integer
        data:
          type: array
          items: {}
      required:
        - current_page
        - first_page_url
        - from
        - last_page
        - last_page_url
        - links
        - next_page_url
        - path
        - per_page
        - prev_page_url
        - to
        - total
        - data
    Notification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        is_read:
          type: boolean
        user_id:
          type:
            - integer
            - "null"
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - title
        - message
        - is_read
        - user_id
        - created_at
        - updated_at
    UserSettings:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        locale:
          type: string
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - user_id
        - locale
        - created_at
        - updated_at
    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          const: false
        message:
          type: string
          description: The first validation message.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field (dot path) -> messages.
