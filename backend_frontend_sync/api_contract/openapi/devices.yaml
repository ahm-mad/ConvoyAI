components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`Authorization: Bearer <token>` where the token is `token` (== `access_token`) from `POST /login`. Valid 7 days; revoked by `POST /logout`."
  responses:
    Unauthenticated:
      description: "Unauthenticated. Missing, malformed, expired or logged-out bearer token. Possible messages: `Authentication required`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Authentication required
              value:
                success: false
                message: Authentication required
    InternalServerError:
      description: "Internal server error. Unexpected failure; no detail is leaked to the client. Possible messages: `Internal server error`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            m1:
              summary: Internal server error
              value:
                success: false
                message: Internal server error
  schemas:
    Device:
      type: object
      properties:
        id:
          type: integer
        device_unique_identifier:
          type: string
        name:
          type: string
        type:
          type:
            - string
            - "null"
        status:
          type: string
        location:
          type: string
        tags:
          type: string
        product_id:
          type: integer
        user_id:
          type: integer
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
        last_updated:
          type: string
      required:
        - id
        - device_unique_identifier
        - name
        - type
        - status
        - location
        - tags
        - product_id
        - user_id
        - created_at
        - updated_at
        - last_updated
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - success
        - message
