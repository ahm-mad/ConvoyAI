      description: "D-0183 (flow 07 F1): the company's fleet settings — timezone, position freshness, idle threshold, scheduled hours per vehicle per day, on-time grace, maintenance due-soon window, KPI targets. A company that never saved any gets the defaults (`is_default: true`)."
      operationId: getFleetSettings
      security:
