      description: "D-0184 (flow 07 C1): every maintenance schedule of the company with its vehicle and the COMPUTED due state (next due date / odometer, days / km until due, status overdue | due_soon | ok | unknown); always paged; filters status, vehicle_id, service_type, vehicle_category, due_before, search; `meta.counts` per status for filter chips"
      operationId: getMaintenanceSchedules
      security:
